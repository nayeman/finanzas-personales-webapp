<script>
// Módulo Deudas
    const Deudas = {
        form:       document.getElementById("deudas-form"),
        submit:     document.getElementById("deuda-submit"),
        status:     document.getElementById("deuda-status"),
        catSelect:  document.getElementById("deuda-categoria"),
        titulo:     document.getElementById("deudas-titulo"),
        saving:     false,

        init() {
            this.cargarCategorias();
            this.form.addEventListener("submit", (e) => this.handleSubmit(e));
        },

        cargarCategorias() {
            google.script.run
                .withSuccessHandler((cats) => {
                    this.catSelect.innerHTML = cats
                        .map((nombre) => `<option value="${esc(nombre)}">${esc(nombre)}</option>`)
                        .join("");
                })
                .withFailureHandler(() => {
                    this.catSelect.innerHTML = "<option value=''>Error al cargar</option>";
                })
                .getCategorias();
        },

        resetForm() {
            this.status.textContent = "";
            this.form.reset();
            document.getElementById("deuda-id").value = "";
            // Abonado: campo manual (default 0); saldo y estado los calcula la app al guardar
            document.getElementById("deuda-abonado").value = "";
            this.titulo.textContent = "Nueva Deuda";
            this.submit.textContent = "Guardar Deuda";
        },

        editarDeuda(d) {
            this.resetForm();
            document.getElementById("deuda-id").value = d.id;
            document.getElementById("deuda-persona").value = d.persona;
            document.getElementById("deuda-total").value = d.total_deuda;
            this.catSelect.value = d.categoria || "";

            document.getElementById("deuda-abonado").value = d.abonado || 0;

            this.titulo.textContent = "Editar Deuda";
            this.submit.textContent = "Actualizar Deuda";

            // Cambiar a la pestaña Deudas
            bootstrap.Tab.getOrCreateInstance(document.getElementById("deudas-tab")).show();
        },

        handleSubmit(e) {
            e.preventDefault();
            if (this.saving || !this.form.reportValidity()) return;

            const idValue = document.getElementById("deuda-id").value;
            const data = {
                persona:      document.getElementById("deuda-persona").value,
                total_deuda:  document.getElementById("deuda-total").value,
                categoria:     document.getElementById("deuda-categoria").value,
                abonado:      document.getElementById("deuda-abonado").value,
            };
            if (idValue) data.id = idValue;

            const esEdicion = Boolean(idValue);

            Confirmar.mostrar({
                titulo: esEdicion ? "Actualizar registro" : "Crear registro",
                mensaje: esEdicion
                    ? `¿Seguro que quieres actualizar la deuda de ${data.persona} por ${formatCOP(data.total_deuda)}? Los cambios quedarán guardados.`
                    : `¿Seguro que quieres crear la deuda de ${data.persona} por ${formatCOP(data.total_deuda)}?`,
                textoOk: esEdicion ? "Actualizar" : "Guardar",
                claseOk: "btn-primary",
                textoProcesando: "Guardando…",
                onConfirmar: () => this.guardar(data, esEdicion),
            });
        },

        /**
         * Envía la deuda confirmada al backend y procesa la respuesta.
         * saveDeuda hace upsert: crea si no trae id y actualiza si lo trae.
         * @param {Object} data Datos del formulario.
         * @param {boolean} esEdicion true si la deuda ya existía.
         */
        guardar(data, esEdicion) {
            const etiqueta = esEdicion ? "Actualizar Deuda" : "Guardar Deuda";

            this.saving          = true;
            this.submit.disabled = true;

            google.script.run
                .withSuccessHandler(() => {
                    this.saving          = false;
                    this.submit.disabled = false;
                    this.submit.textContent = etiqueta;
                    Confirmar.cerrar();
                    showStatus(this.status, "Deuda guardada correctamente.", "success");
                    this.resetForm();
                    // Opcional: Actualizar vista si están en Visualizar
                    if (typeof Visualizar !== "undefined") {
                        Visualizar.recargarDeudas();
                    }
                })
                .withFailureHandler((err) => {
                    this.saving          = false;
                    this.submit.disabled = false;
                    this.submit.textContent = etiqueta;
                    const mensaje = err?.message || String(err) || "No se pudo guardar la deuda.";
                    Confirmar.fallo(mensaje);
                    showStatus(this.status, mensaje, "danger");
                })
                .saveDeuda(data);
        },
    };
</script>
