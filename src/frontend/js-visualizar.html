<script>
// Módulo Visualizar (tablas de Movimientos y Deudas)
    // Responsabilidad: cargar datos del backend y definir cómo se pinta cada fila.
    // Búsqueda, paginación, selección y filtro por mes viven en el módulo Tabla (js-tabla).

    const Visualizar = {
        tablaMov:     null, // instancia Tabla de movimientos
        tablaDeudas:  null, // instancia Tabla de deudas

        el: {
            btnAgregar: document.getElementById("btn-agregar"),
        },

        init() {
            this.tablaMov = crearTabla({
                body: "dt-body",
                search: "dt-search",
                pageSize: "dt-page-size",
                info: "dt-info",
                pagination: "dt-pagination",
                selectAll: "dt-select-all",
                colspan: 6,
                vacio: "Sin registros.",
                mes: "dt-filter-month",
                titulo: "dt-title",
                filtroMes: (r, mes) => String(r.fecha || "").startsWith(mes),
                tituloTexto: (mes) => {
                    const nombre = nombreMes(mes);
                    return nombre
                        ? `Histórico de Movimientos · ${nombre}`
                        : "Histórico de Movimientos · Todos los meses";
                },
                renderFila: (r) => this.crearFilaMovimiento(r),
            }).init();

            this.tablaDeudas = crearTabla({
                body: "deudas-body",
                search: "dd-search",
                pageSize: "dd-page-size",
                info: "dd-info",
                pagination: "dd-pagination",
                selectAll: "dd-select-all",
                colspan: 6,
                vacio: "No hay deudas registradas.",
                renderFila: (d) => this.crearFilaDeuda(d),
            }).init();

            // Botón Agregar → resetear formulario y navegar a Registrar
            this.el.btnAgregar.addEventListener("click", () => {
                Registrar.resetForm();
                bootstrap.Tab.getOrCreateInstance(document.getElementById("registrar-tab")).show();
            });

            // Cargar datos la primera vez que se activa la pestaña
            document.getElementById("visualizar-tab").addEventListener("shown.bs.tab", () => {
                if (this.tablaMov.datos.length === 0) this.recargar();
                if (this.tablaDeudas.datos.length === 0) this.recargarDeudas();
            });
        },

        /** Descarga todos los movimientos del backend y actualiza la tabla. */
        recargar() {
            this.tablaMov.cargando("Cargando…");
            google.script.run
                .withSuccessHandler((rows) => this.tablaMov.setDatos(rows))
                .withFailureHandler((err) =>
                    this.tablaMov.error(`Error al cargar: ${esc(err?.message || String(err))}`))
                .getMovimientos();
        },

        /** Descarga todas las deudas del backend y actualiza la tabla de deudas. */
        recargarDeudas() {
            this.tablaDeudas.cargando("Cargando…");
            google.script.run
                .withSuccessHandler((deudas) => this.tablaDeudas.setDatos(deudas))
                .withFailureHandler((err) =>
                    this.tablaDeudas.error(`Error al cargar deudas: ${esc(err?.message || String(err))}`))
                .getDeudas();
        },

        /**
         * Crea la fila de un movimiento (columna de selección + datos + acciones).
         * B2: todos los campos dinámicos pasan por esc() para prevenir XSS.
         * @param {Object} r Objeto movimiento.
         * @returns {HTMLTableRowElement}
         */
        crearFilaMovimiento(r) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="d-none d-md-table-cell"><input type="checkbox" class="dt-row-check" value="${esc(r.id)}" aria-label="Seleccionar fila"></td>
              <td class="small text-nowrap">${esc(r.fecha) || "—"}</td>
              <td class="small d-none d-md-table-cell">
                <span class="badge ${String(r.tipo).toLowerCase() === 'ingreso' ? 'bg-success' : 'bg-danger'}">${capitalize(esc(r.tipo)) || "—"}</span>
              </td>
              <td>
                <div class="fw-bold small" style="color: var(--color-primary);">${capitalize(esc(r.categoria)) || "—"}</div>
                <div class="small text-muted text-truncate" style="max-width: 150px;">${capitalize(esc(r.descripcion)) || "—"}</div>
              </td>
              <td class="small text-end fw-600 ${String(r.tipo).toLowerCase() === 'ingreso' ? 'text-success' : 'text-danger'}">
                ${String(r.tipo).toLowerCase() === 'gasto' ? '-' : ''}${formatCOP(r.valor)}
              </td>
              <td class="text-center text-nowrap">
                <button class="btn btn-outline-primary btn-sm px-2 py-1" data-action="editar"
                  aria-label="Ver o editar movimiento" title="Ver registro completo">
                  <i class="bi bi-pencil-fill" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm px-2 py-1 ms-1" data-action="eliminar"
                  aria-label="Eliminar movimiento">
                  <i class="bi bi-trash-fill" aria-hidden="true"></i>
                </button>
              </td>`;

            tr.querySelector("[data-action='editar']").addEventListener("click", () => {
                Registrar.editarMovimiento(r);
            });
            tr.querySelector("[data-action='eliminar']").addEventListener("click", () => {
                this.pedirConfirmacion("movimiento", r);
            });

            return tr;
        },

        /**
         * Crea la fila de una deuda (columna de selección + datos + acciones).
         * La barra de progreso del Estado se mantiene igual que siempre.
         * @param {Object} d Objeto deuda.
         * @returns {HTMLTableRowElement}
         */
        crearFilaDeuda(d) {
            const tr = document.createElement("tr");
            const progress = d.total_deuda > 0 ? (d.abonado / d.total_deuda) * 100 : 0;
            tr.innerHTML = `
              <td class="d-none d-md-table-cell"><input type="checkbox" class="dt-row-check" value="${esc(d.id)}" aria-label="Seleccionar fila"></td>
              <td class="fw-bold small" style="color: var(--color-primary);">${esc(d.persona)}</td>
              <td class="small text-end fw-600">${formatCOP(d.total_deuda)}</td>
              <td class="small text-end text-success">${formatCOP(d.abonado)}</td>
              <td class="text-center" style="width: 100px;">
                <span class="badge ${d.estado === 'Pagado' ? 'bg-success' : 'bg-warning text-dark'} w-100">${esc(d.estado)}</span>
                <div class="progress mt-1" style="height: 4px;">
                  <div class="progress-bar ${d.estado === 'Pagado' ? 'bg-success' : 'bg-primary'}" role="progressbar" style="width: ${progress}%" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              </td>
              <td class="text-center text-nowrap">
                <button class="btn btn-outline-primary btn-sm px-2 py-1" data-action="editar-deuda"
                  aria-label="Ver o editar deuda">
                  <i class="bi bi-pencil-fill" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm px-2 py-1 ms-1" data-action="eliminar-deuda"
                  aria-label="Eliminar deuda">
                  <i class="bi bi-trash-fill" aria-hidden="true"></i>
                </button>
              </td>`;

            tr.querySelector("[data-action='editar-deuda']").addEventListener("click", () => {
                Deudas.editarDeuda(d);
            });
            tr.querySelector("[data-action='eliminar-deuda']").addEventListener("click", () => {
                this.pedirConfirmacion("deuda", d);
            });

            return tr;
        },

        /**
         * Abre el modal global de confirmación para eliminar, mostrando los datos
         * del registro resumidos en el mensaje.
         * @param {string} type "movimiento" o "deuda"
         * @param {Object} registro Registro completo a eliminar.
         */
        pedirConfirmacion(type, registro) {
            const datos = type === "movimiento"
                ? `${capitalize(registro.tipo)} · ${capitalize(registro.categoria)} · ${formatCOP(registro.valor)}`
                : `${registro.persona} · ${formatCOP(registro.total_deuda)} · ${registro.estado}`;

            Confirmar.mostrar({
                titulo:  "Eliminar registro",
                mensaje: `¿Seguro que quieres eliminar este registro? Esta acción no se puede deshacer. Registro: ${datos}`,
                textoOk: "Eliminar",
                claseOk: "btn-danger",
                textoProcesando: "Eliminando…",
                onConfirmar: () => this.eliminar(type, registro.id),
            });
        },

        /**
         * Ejecuta la eliminación confirmada y recarga la tabla correspondiente.
         * @param {string} type "movimiento" o "deuda"
         * @param {string} id ID del registro a eliminar.
         */
        eliminar(type, id) {
            const exito = () => {
                Confirmar.cerrar();
                showStatus({ className: "", textContent: "" },
                    type === "movimiento" ? "Movimiento eliminado." : "Deuda eliminada.", "success");
                if (type === "movimiento") this.recargar();
                else this.recargarDeudas();
            };

            const run = google.script.run
                .withSuccessHandler(exito)
                .withFailureHandler((err) => Confirmar.fallo(err));

            if (type === "movimiento") run.deleteMovimiento(id);
            else run.deleteDeuda(id);
        }
    };
</script>
