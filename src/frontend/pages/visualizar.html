<!-- Parcial: vista Visualizar — Tablas de Movimientos y Deudas. -->
<section class="tab-pane fade" id="visualizar-panel" role="tabpanel" aria-labelledby="visualizar-tab" tabindex="0">
  <div class="app-frame px-3 py-3">
    <div class="form-surface">

      <!-- Cabecera: Toggle Movimientos / Deudas -->
      <div class="d-flex justify-content-center mb-4">
        <ul class="nav nav-pills mode-switch" id="visualizar-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="view-movimientos-tab" data-bs-toggle="tab" data-bs-target="#view-movimientos" type="button" role="tab">Movimientos</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="view-deudas-tab" data-bs-toggle="tab" data-bs-target="#view-deudas" type="button" role="tab">Deudas</button>
          </li>
        </ul>
      </div>

      <div class="tab-content" id="visualizar-tabContent">
        
        <!-- ── TAB: MOVIMIENTOS ── -->
        <div class="tab-pane fade show active" id="view-movimientos" role="tabpanel" aria-labelledby="view-movimientos-tab">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="app-section-title mb-0" id="dt-title">Movimientos</h2>
            <button class="btn btn-primary btn-sm" id="btn-agregar" type="button">
              <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar
            </button>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
            <div class="d-flex align-items-center gap-2">
              <span class="small text-muted">Show</span>
              <select class="form-select form-select-sm" id="dt-page-size" style="width:auto">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
              <span class="small text-muted">entries</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <input type="month" class="form-control form-control-sm" id="dt-filter-month" style="width:auto"
                aria-label="Filtrar histórico por mes y año">
              <input class="form-control form-control-sm" id="dt-search" placeholder="Search…" style="max-width:180px" aria-label="Buscar movimiento">
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-2" id="dt-table">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="d-none d-md-table-cell" style="width: 40px;"><input type="checkbox" id="dt-select-all"></th>
                  <th scope="col">Fecha</th>
                  <th scope="col" class="d-none d-md-table-cell">Tipo</th>
                  <th scope="col">Detalle</th>
                  <th scope="col" class="text-end">Valor</th>
                  <th scope="col" class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="dt-body"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="small text-muted" id="dt-info">Showing 0 to 0 of 0 entries</span>
            <nav aria-label="Paginación de movimientos"><ul class="pagination pagination-sm mb-0" id="dt-pagination"></ul></nav>
          </div>
        </div>

        <!-- ── TAB: DEUDAS ── -->
        <div class="tab-pane fade" id="view-deudas" role="tabpanel" aria-labelledby="view-deudas-tab">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="app-section-title mb-0" id="dt-title-deudas">Deudas</h2>
            <button class="btn btn-primary btn-sm" id="btn-agregar-deuda" type="button" onclick="document.getElementById('deudas-tab').click()">
              <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar
            </button>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-2 gap-2 flex-wrap">
            <div class="d-flex align-items-center gap-2">
              <span class="small text-muted">Show</span>
              <select class="form-select form-select-sm" id="dd-page-size" style="width:auto">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
              <span class="small text-muted">entries</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <input type="month" class="form-control form-control-sm" id="dd-filter-month" style="width:auto"
                aria-label="Filtrar deudas por mes y año">
              <input class="form-control form-control-sm" id="dd-search" placeholder="Search…" style="max-width:180px" aria-label="Buscar deuda">
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-2" id="deudas-table">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="d-none d-md-table-cell" style="width: 40px;"><input type="checkbox" id="dd-select-all" aria-label="Seleccionar todas las deudas"></th>
                  <th scope="col">Persona/Entidad</th>
                  <th scope="col" class="text-end">Total</th>
                  <th scope="col" class="text-end">Abonado</th>
                  <th scope="col" class="text-center">Estado</th>
                  <th scope="col" class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="deudas-body"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="small text-muted" id="dd-info">Showing 0 to 0 of 0 entries</span>
            <nav aria-label="Paginación de deudas"><ul class="pagination pagination-sm mb-0" id="dd-pagination"></ul></nav>
          </div>
        </div>

      </div>

    </div>
  </div>
</section>
